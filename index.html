<!doctype html>
<!-- FAIRROTA BUILD K :: full designed UI on the live Supabase backend -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FairRota</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  :root{
    --paper:#EBEFE6;--surface:#FCFDFB;--sunk:#EEF2EA;--ink:#16231C;--soft:#53605A;--faint:#8A948C;--line:#DCE3D6;
    --pine:#1E6B47;--pine-deep:#12512F;--pine-wash:#E3EEE7;--rested:#2C8577;--owe:#B4761E;--owe-ink:#6F4711;
    --info:#5A6B8C;--info-wash:#E7EBF3;--danger:#B23B2E;--danger-wash:#F6E1DD;
    --disp:'Fraunces',Georgia,serif;--body:'Plus Jakarta Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);min-height:100vh;padding:22px 15px 44px;-webkit-font-smoothing:antialiased;line-height:1.5;}
  .wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
  .center{min-height:82vh;display:flex;align-items:center;justify-content:center;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;}
  .card.elev{box-shadow:0 14px 34px -22px rgba(20,60,40,.45);}
  .mark{font-family:var(--disp);font-weight:600;font-size:29px;letter-spacing:-.02em;color:var(--pine-deep);line-height:1;}
  .tag{color:var(--soft);font-size:14px;margin-top:5px;}
  h1{font-family:var(--disp);font-weight:600;font-size:23px;letter-spacing:-.01em;margin-bottom:6px;}
  h2{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.01em;}
  .sub{color:var(--soft);font-size:14px;line-height:1.55;margin-bottom:16px;}
  .input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:15px;margin-bottom:10px;background:var(--surface);font-family:inherit;}
  .input:focus{outline:2px solid var(--pine);border-color:transparent;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;font-weight:600;font-size:14px;border-radius:11px;padding:11px 16px;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s,transform .05s;}
  .btn:active{transform:translateY(1px);}
  .btn.block{width:100%;}
  .btn.primary{background:var(--pine);color:#fff;}.btn.primary:hover{background:var(--pine-deep);}
  .btn.soft{background:var(--pine-wash);color:var(--pine-deep);}.btn.soft:hover{background:#d5e8dc;}
  .btn.ghost{background:var(--surface);color:var(--soft);border-color:var(--line);}.btn.ghost:hover{border-color:var(--faint);color:var(--ink);}
  .btn.quiet{background:none;color:var(--faint);padding:8px 9px;}.btn.quiet:hover{color:var(--ink);}
  .btn.danger-soft{background:var(--danger-wash);color:var(--danger);}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:9px;}
  .link{background:none;border:none;color:var(--soft);font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit;}
  .or{text-align:center;color:var(--faint);font-size:12px;margin:12px 0;}
  .msg{font-size:13px;color:var(--soft);margin-top:10px;line-height:1.5;}
  .err{color:var(--danger);}
  /* header/tabs */
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .who{color:var(--soft);font-size:13px;margin-top:2px;}
  .tabs{display:flex;gap:5px;background:var(--sunk);border-radius:12px;padding:4px;}
  .tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--soft);padding:10px;border-radius:8px;cursor:pointer;}
  .tab.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px -2px rgba(20,60,40,.28);}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pine);color:#fff;font-size:11px;font-weight:700;}
  .badge.alert{background:var(--owe);}
  /* jobs */
  .mine-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .mine-title{font-family:var(--disp);font-weight:600;font-size:20px;}
  .mine-sub{color:var(--soft);font-size:13.5px;margin-top:2px;}
  .prog-bar{height:7px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-bottom:16px;}
  .prog-bar i{display:block;height:100%;background:var(--pine);border-radius:999px;transition:width .5s cubic-bezier(.22,1,.36,1);}
  .jobs{display:flex;flex-direction:column;gap:9px;}
  .jlabel{font-size:13px;font-weight:700;color:var(--faint);margin:8px 2px 1px;}
  .jlabel:first-child{margin-top:0;}
  .job{border:1px solid var(--line);border-radius:14px;padding:13px;}
  .job.accepted{background:var(--info-wash);border-color:transparent;}
  .job.done{background:var(--sunk);border-color:transparent;}
  .job.done .jn{text-decoration:line-through;color:var(--faint);}
  .job-top{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap;}
  .jn{font-weight:600;font-size:15.5px;}
  .count{font-size:11.5px;font-weight:600;color:var(--soft);background:var(--sunk);border-radius:999px;padding:2px 8px;}
  .pill{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;margin-left:auto;}
  .pill.todo{background:var(--sunk);color:var(--faint);}.pill.accepted{background:#fff;color:var(--info);}.pill.done{background:var(--pine-wash);color:var(--pine-deep);}
  .job-acts{display:flex;gap:8px;align-items:center;}
  .dots{display:inline-flex;gap:2.5px;align-items:center;}
  .dots i{width:5px;height:5px;border-radius:50%;background:#CBD4C6;display:inline-block;}
  .dots i.l1{background:var(--pine);}.dots i.l2{background:var(--pine-deep);}.dots i.l3{background:var(--owe);}
  .none{color:var(--faint);font-size:14px;}
  .pool{margin-top:16px;padding-top:15px;border-top:1px dashed var(--line);}
  .pool-h{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px;}
  .poolrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;}
  .poolrow .nm{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;}
  /* everyone */
  .weekbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .week{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.01em;}
  .acts{display:flex;gap:8px;flex-wrap:wrap;}
  .hero{background:var(--pine-wash);border-radius:16px;padding:16px;margin-bottom:16px;}
  .hero-h{font-family:var(--disp);font-weight:600;font-size:18px;color:var(--pine-deep);margin-bottom:14px;}
  .brow{display:flex;align-items:center;gap:11px;margin-bottom:12px;}
  .bname{width:66px;font-size:14px;font-weight:600;flex:0 0 auto;}
  .bbar{position:relative;flex:1;height:16px;background:#fff;border-radius:999px;overflow:hidden;}
  .bfill{height:100%;border-radius:999px;background:var(--pine);transform-origin:left center;animation:fill .6s cubic-bezier(.22,1,.36,1) both;}
  .bfill.rested{background:var(--rested);}.bfill.owe{background:var(--owe);}
  @keyframes fill{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  .fairline{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.28;border-radius:2px;z-index:1;}
  .btag{width:84px;text-align:right;font-size:11.5px;font-weight:600;flex:0 0 auto;color:var(--faint);}
  .btag.rested{color:var(--rested);}.btag.owe{color:var(--owe-ink);}
  .fairkey{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--soft);margin-bottom:12px;}
  .fairkey i{width:2px;height:12px;background:var(--ink);opacity:.32;border-radius:2px;}
  .verdict{background:#fff;border-radius:12px;padding:11px 14px;font-size:14.5px;line-height:1.5;color:var(--pine-deep);font-weight:500;}
  .sec-h{font-size:13px;font-weight:700;color:var(--ink);margin:20px 0 9px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--soft);}
  .chip b{color:var(--ink);}
  .feed{display:flex;flex-direction:column;gap:8px;}
  .feedrow{font-size:13.5px;color:var(--soft);}
  .feedrow b{color:var(--ink);}
  .foot{text-align:center;color:var(--faint);font-size:12px;padding:4px 0 0;}
  @media(prefers-reduced-motion:reduce){.bfill,.prog-bar i{animation:none;transition:none;}}
  .chorelist{display:flex;flex-direction:column;gap:9px;margin-bottom:12px;}
  .chorerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .chorerow .cn{font-weight:600;font-size:14.5px;flex:1;min-width:110px;}
  .pw{display:inline-flex;align-items:center;gap:8px;}
  .pw b{font-size:13px;min-width:26px;text-align:center;color:var(--ink);}
  .addchore{border-top:1px dashed var(--line);padding-top:12px;}
  .btn.accept{background:var(--pine-wash);color:var(--pine-deep);}
  .btn.accept:hover{background:#d5e8dc;}
  .btn.cant{background:var(--danger-wash);color:var(--danger);}
  .btn.cant:hover{filter:brightness(.98);}
  .setblock{padding:14px 0;border-bottom:1px solid var(--line);}
  .setblock:last-child{border-bottom:none;}
  .setlab{display:block;font-size:12px;font-weight:700;color:var(--faint);margin-bottom:8px;letter-spacing:.02em;}
  .setrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .setrow .input{margin-bottom:0;flex:1;min-width:150px;}
  .setval{font-size:14.5px;color:var(--ink);}
  .note{color:var(--faint);font-size:12px;}
  /* --- build H: uniform buttons + components --- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 16px;font-family:var(--body);font-weight:600;font-size:14px;line-height:1;border-radius:11px;border:1.5px solid transparent;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s;}
  .btn:active{transform:translateY(1px);}
  .btn.block{width:100%;}
  .btn.sm{height:42px;padding:0 14px;font-size:14px;border-radius:11px;}
  .btn.primary,.btn.accept,.btn.soft{background:var(--pine);border-color:var(--pine);color:#fff;}
  .btn.primary:hover,.btn.accept:hover,.btn.soft:hover{background:var(--pine-deep);border-color:var(--pine-deep);}
  .btn.ghost,.btn.quiet{background:var(--surface);border-color:var(--line);color:var(--ink);height:42px;padding:0 16px;border-radius:11px;}
  .btn.ghost:hover,.btn.quiet:hover{border-color:var(--faint);}
  .btn.cant,.btn.danger-soft{background:var(--surface);border-color:#E0B0A8;color:var(--danger);}
  .btn.cant:hover,.btn.danger-soft:hover{background:var(--danger-wash);}
  .step{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;min-width:34px;padding:0 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer;}
  .step:hover{border-color:var(--faint);}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--soft);cursor:pointer;flex:0 0 auto;}
  .iconbtn:hover{border-color:var(--faint);color:var(--ink);}
  .iconbtn svg{width:20px;height:20px;display:block;}
  .brandrow{display:flex;align-items:center;gap:11px;}
  .brandrow svg{display:block;border-radius:10px;flex:0 0 auto;}
  .daysel{height:42px;border:1.5px solid var(--line);border-radius:11px;padding:0 10px;font-family:var(--body);font-size:13px;font-weight:600;background:var(--surface);color:var(--ink);cursor:pointer;}
  .daybadge{font-size:11px;font-weight:700;background:var(--pine-wash);color:var(--pine-deep);border-radius:999px;padding:3px 9px;}
  .job-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .mark{font-family:var(--disp);}
  .daypick{margin:11px 0 3px;}
  .dp-label{font-size:11.5px;font-weight:600;color:var(--faint);display:block;margin-bottom:7px;}
  .daychips{display:flex;flex-wrap:wrap;gap:6px;}
  .daychip{font-family:var(--body);font-size:13px;font-weight:600;border-radius:9px;padding:7px 11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;}
  .daychip:hover{border-color:var(--faint);}
  .daychip.sel{background:var(--pine);border-color:var(--pine);color:#fff;}
  .daychip.taken{background:var(--sunk);border-color:transparent;color:var(--faint);cursor:not-allowed;text-decoration:line-through;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 14px 34px -12px rgba(0,0,0,.45);max-width:92%;text-align:center;line-height:1.4;}
</style>
</head>
<body>
<div class="wrap"><div id="app"><div class="card"><p class="sub">Loading…</p></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var app=document.getElementById('app');
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function logo(sz){return '<svg viewBox="0 0 48 48" width="'+sz+'" height="'+sz+'" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#12512F"/><rect x="9" y="15" width="26" height="6" rx="3" fill="#EBEFE6"/><rect x="9" y="27" width="17" height="6" rx="3" fill="#8FC9B0"/><line x1="24" y1="10" x2="24" y2="38" stroke="#F2A63C" stroke-width="2.5" stroke-linecap="round"/></svg>';}
  var GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';

  function showError(m){app.innerHTML='<div class="card"><h1>Something needs a look</h1><p class="sub err">'+esc((m&&m.message)||m||'Unknown error')+'</p></div>';}
  function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},3600);}
  window.addEventListener('error',function(e){showError(e.message);});
  window.addEventListener('unhandledrejection',function(e){showError((e.reason&&e.reason.message)||e.reason);});

  var CONFIG={ url:"https://kqdhizxwnjifpmqeqwxb.supabase.co", key:"sb_publishable_fS0vQqjVI0pdE-jiX7Z0LQ_bxOJzjsc" };
  if(!window.supabase||!window.supabase.createClient){showError("Couldn't load the Supabase library. Check your connection and hard-refresh.");return;}
  var sb=window.supabase.createClient(CONFIG.url.trim(),CONFIG.key.trim(),{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
  var params=new URLSearchParams(location.search);
  var inviteToken=params.get('token');
  var homeUrl=location.origin+location.pathname;

  var DEFAULT_CHORES=[{name:'Dishes',effort:2,per_week:5},{name:'Cook dinner',effort:2,per_week:4},{name:'Take out bins',effort:2,per_week:1},{name:'Bathroom clean',effort:3,per_week:1},{name:'Vacuum',effort:3,per_week:1}];
  var EFFORT={1:'Light',2:'Medium',3:'Heavy'};
  var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  function dots(n){var s='<span class="dots" title="'+EFFORT[n]+'">';for(var i=1;i<=3;i++)s+='<i class="'+(i<=n?'l'+n:'')+'"></i>';return s+'</span>';}

  function generateRota(members,chores,totals){
    var present=members.filter(function(m){return !m.is_away&&m.status==='active';});
    if(!present.length||!chores.length)return [];
    var inst=[];chores.forEach(function(c){var n=Math.max(1,c.per_week||1);for(var i=0;i<n;i++)inst.push({chore_id:c.id,name:c.name,effort:c.effort});});
    inst.sort(function(a,b){return b.effort-a.effort;});
    var load={},held={};present.forEach(function(m){load[m.id]=totals[m.id]||0;held[m.id]={};});
    var rota=[];
    inst.forEach(function(x){
      var c=present.filter(function(m){return !held[m.id][x.chore_id];});if(!c.length)c=present.slice();
      var min=Math.min.apply(null,c.map(function(m){return load[m.id];}));
      var tied=c.filter(function(m){return load[m.id]===min;});
      var pick=tied[Math.floor(Math.random()*tied.length)];
      load[pick.id]+=x.effort;held[pick.id][x.chore_id]=true;
      rota.push({chore_id:x.chore_id,name:x.name,effort:x.effort,member_id:pick.id,status:'todo'});
    });
    return rota;
  }

  var S={household:null,me:null,members:[],chores:[],assignments:[],events:[],tab:'mine'};

  async function loadAll(){
    var hh=await sb.from('households').select('id,name');if(hh.error)throw hh.error;
    if(!hh.data||!hh.data.length){S.household=null;return;}
    S.household=hh.data[0];
    var res=await Promise.all([
      sb.from('members').select('id,user_id,display_name,role,status,is_away,carried_effort').eq('household_id',S.household.id),
      sb.from('chores').select('id,name,effort,per_week').eq('household_id',S.household.id),
      sb.from('assignments').select('id,chore_id,member_id,name,effort,status').eq('household_id',S.household.id),
      sb.from('events').select('member_id,type,chore_name,at').eq('household_id',S.household.id).order('at',{ascending:false}).limit(6)
    ]);
    for(var i=0;i<res.length;i++)if(res[i].error)throw res[i].error;
    S.members=res[0].data||[];S.chores=res[1].data||[];S.assignments=res[2].data||[];S.events=res[3].data||[];
    var uid=(await sb.auth.getUser()).data.user.id;
    S.me=S.members.filter(function(m){return m.user_id===uid;})[0]||null;
  }
  function totals(){var t={};S.members.forEach(function(m){t[m.id]=(m.carried_effort||0);});S.assignments.forEach(function(a){if(a.status==='done'&&a.member_id)t[a.member_id]=(t[a.member_id]||0)+a.effort;});return t;}
  function nameOf(id){var m=S.members.filter(function(x){return x.id===id;})[0];return m?m.display_name:'Someone';}
  function ago(ts){var s=(Date.now()-new Date(ts).getTime())/1000;if(s<60)return 'just now';var m=s/60;if(m<60)return Math.floor(m)+'m ago';var h=m/60;if(h<24)return Math.floor(h)+'h ago';return Math.floor(h/24)+'d ago';}

  async function setStatus(id,st){
    var a=S.assignments.filter(function(x){return x.id===id;})[0];
    var up=await sb.from('assignments').update({status:st}).eq('id',id);if(up.error)return showError(up.error);
    if(st==='done'&&a)await sb.from('events').insert({household_id:S.household.id,member_id:a.member_id,type:'completed',chore_name:a.name});
    await refresh();
  }
  async function releaseItem(id){var up=await sb.from('assignments').update({member_id:null,status:'pool',day:null}).eq('id',id);if(up.error)return showError(up.error);await refresh();}
  async function claimItem(id){var up=await sb.from('assignments').update({member_id:S.me.id,status:'todo'}).eq('id',id);if(up.error)return showError(up.error);await refresh();}
  async function generateWeek(){
    var chores=S.chores;
    if(!chores.length){var seed=await sb.from('chores').insert(DEFAULT_CHORES.map(function(c){return {household_id:S.household.id,name:c.name,effort:c.effort,sched:'flex',per_week:c.per_week,days:[]};})).select();if(seed.error)return showError(seed.error);chores=seed.data||[];S.chores=chores;}
    var rota=generateRota(S.members,chores,totals());if(!rota.length)return;

  async function rollover(){
    if(typeof window.confirm==='function' && !window.confirm('Start a new week? This clears the current chores and carries the fairness balance forward.')) return;
    var add={};
    S.assignments.forEach(function(a){if(a.status==='done'&&a.member_id)add[a.member_id]=(add[a.member_id]||0)+a.effort;});
    for(var mid in add){
      var m=S.members.filter(function(x){return x.id===mid;})[0];
      var nv=(m?(m.carried_effort||0):0)+add[mid];
      var u=await sb.from('members').update({carried_effort:nv}).eq('id',mid);
      if(u.error)return showError(u.error);
      if(m)m.carried_effort=nv;
    }
    var d=await sb.from('assignments').delete().eq('household_id',S.household.id);
    if(d.error)return showError(d.error);
    S.assignments=[];
    var rota=generateRota(S.members,S.chores,totals());
    if(rota.length){
      var rows=rota.map(function(r){return {household_id:S.household.id,chore_id:r.chore_id,member_id:r.member_id,name:r.name,effort:r.effort,sched:'flex',status:'todo',week:1};});
      var ins=await sb.from('assignments').insert(rows);
      if(ins.error)return showError(ins.error);
    }
    await refresh();
  }

  function mineView(){
    if(!S.me)return '<p class="none">You\'re not an active member here.</p>';

        html+='<div class="job accepted"><div class="job-top">'+dots(a.effort)+'<span class="jn">'+esc(a.name)+'</span>'+db+'<span class="pill accepted">Doing</span></div>'
          +'<div class="job-acts"><button class="btn accept" data-act="done" data-id="'+a.id+'">Mark done</button></div></div>';
      });
    }

          +'<div class="daypick" data-grp="'+k+'"><span class="dp-label">Pick a day (struck-through days are already taken)</span><div class="daychips">'+chips+'</div></div>'

  function everyoneView(){
    var present=S.members.filter(function(m){return !m.is_away&&m.status==='active';});
    var t=totals();
    var maxv=Math.max(1,Math.max.apply(null,present.map(function(m){return t[m.id]||0;}).concat([0])));
    var mean=present.length?present.reduce(function(s,m){return s+(t[m.id]||0);},0)/present.length:0;
    var noRota=S.assignments.length===0;
    var isHost=S.me&&S.me.role==='host';
    var anyDone=S.assignments.some(function(a){return a.status==='done';});

    var html='<div class="weekbar"><span class="week">This week</span><div class="acts">';
    if(noRota)html+='<button id="gen" class="btn primary sm">Set up this week\'s chores</button>';
    if(!noRota)html+='<button id="roll" class="btn ghost sm">Start next week</button>';
    html+='<button id="rf" class="btn ghost sm">Refresh</button></div></div>';

    html+='<div class="hero"><div class="hero-h">This week\'s balance</div>';
    if(!present.length){html+='<div class="verdict">No one\'s active right now.</div>';}
    else if(present.length===1){html+='<div class="verdict">It\'s just you right now. Invite housemates below and the balance will share the load.</div>';}
    else{
      present.forEach(function(m){
        var v=t[m.id]||0;var k=v>=mean+2?'rested':v<=mean-2?'owe':'';var tag=k==='rested'?'owed a break':k==='owe'?'owes a bit':'fair';
        html+='<div class="brow"><span class="bname">'+esc(m.display_name)+'</span><div class="bbar">'+(mean>0?'<span class="fairline" style="left:'+(mean/maxv*100)+'%"></span>':'')+'<div class="bfill '+k+'" style="width:'+(v/maxv*100)+'%"></div></div><span class="btag '+k+'">'+tag+'</span></div>';
      });
      if(mean>0)html+='<div class="fairkey"><i></i> the fair line — where everyone\'s even</div>';
      var ranked=present.map(function(m){return {n:m.display_name,r:t[m.id]||0};}).sort(function(a,b){return b.r-a.r;});
      var spread=ranked.length>1?ranked[0].r-ranked[ranked.length-1].r:0;
      var allzero=ranked.every(function(r){return r.r===0;});
      var verdict=allzero?'Nothing done yet — the balance fills as chores get ticked off.':spread<=2?'Nicely balanced.':esc(ranked[0].n)+' is owed a break; '+esc(ranked[ranked.length-1].n)+' is due the heavier jobs. It evens out over the weeks.';
      html+='<div class="verdict">'+verdict+'</div>';
    }
    html+='</div>';

    if(!noRota){
      html+='<div class="sec-h">Progress this week</div><div class="chips">';
      present.forEach(function(m){var mine=S.assignments.filter(function(a){return a.member_id===m.id;});var d=mine.filter(function(a){return a.status==='done';}).length;html+='<span class="chip">'+esc(m.display_name)+' <b>'+d+'/'+mine.length+'</b></span>';});
      html+='</div>';
    }
    if(S.events&&S.events.length){
      html+='<div class="sec-h">Just done</div><div class="feed">';
      S.events.filter(function(e){return e.type==='completed';}).forEach(function(e){html+='<div class="feedrow">✓ <b>'+esc(nameOf(e.member_id))+'</b> '+esc(e.chore_name)+' · '+ago(e.at)+'</div>';});
      html+='</div>';
    }

    html+='<div class="sec-h">Chores <span class="count">'+S.chores.length+'</span></div>';
    if(isHost) html+='<p class="sub" style="margin:0 0 10px">Changes take effect the next time a week is set up. Tap effort to cycle it; use minus and plus for times per week.</p>';
    else html+='<p class="sub" style="margin:0 0 10px">Only the host can change chores.</p>';
    html+='<div class="chorelist">';

      if(isHost){
        html+='<div class="chorerow"><span class="cn">'+esc(c.name)+'</span>'
          +'<button class="step" data-cact="eff" data-cid="'+c.id+'">'+dots(c.effort)+' '+EFFORT[c.effort]+'</button>'
          +'<span class="pw"><button class="step" data-cact="pwdown" data-cid="'+c.id+'">-</button><b>'+c.per_week+'x</b><button class="step" data-cact="pwup" data-cid="'+c.id+'">+</button></span>'
          +'<button class="btn cant sm" data-cact="del" data-cid="'+c.id+'">Remove</button></div>';
      } else {
        html+='<div class="chorerow"><span class="cn">'+esc(c.name)+'</span><span class="setval" style="flex:0 0 auto;color:var(--soft);font-size:13px">'+dots(c.effort)+' '+EFFORT[c.effort]+' · '+c.per_week+'x/week</span></div>';
      }
    });
    html+='</div>';
    if(isHost){
      html+='<div class="addchore"><input id="ncn" class="input" placeholder="Add a chore, e.g. Laundry" />'
        +'<div class="acts" style="margin-top:2px"><button class="step" id="nceff" data-eff="2">'+dots(2)+' Medium</button>'
        +'<span class="pw"><button class="step" id="ncpwd">-</button><b id="ncpw">1x</b><button class="step" id="ncpwu">+</button></span>'
        +'<button class="btn soft sm" id="ncadd">Add chore</button></div><p id="ncmsg" class="msg"></p></div>';
    }
    html+='<div class="sec-h">Household</div><div class="chips">';
    S.members.filter(function(m){return m.status==='active';}).forEach(function(m){html+='<span class="chip">'+esc(m.display_name)+(m.role==='host'?' <b>host</b>':'')+'</span>';});
    html+='</div><p class="sub" style="margin:2px 0 10px">Tap <b>Invite someone</b> to get a private join link, then send it to them yourself — by email, WhatsApp or text. They open it, sign in with Google, and they are in your household.</p><div class="acts"><button id="inv" class="btn soft sm">Invite someone</button><button id="newhh" class="btn ghost sm">Start a new household</button></div><div id="invout"></div>';
    return html;

    h+='<div class="setblock"><label class="setlab">Members</label>';
    S.members.filter(function(m){return m.status==='active';}).forEach(function(m){
      h+='<div class="setrow"><span class="setval">'+esc(m.display_name)+(m.role==='host'?' · host':'')+(m.is_away?' · away':'')+'</span>';
      if(isHost&&m.role!=='host') h+='<button class="btn ghost sm" data-sact="makehost" data-sid="'+m.id+'">Make host</button>';
      h+='</div>';
    });
    h+='</div>';
    h+='<div class="setblock"><label class="setlab">Danger zone</label><div class="acts"><button id="sleave" class="btn cant sm">Leave household</button>';
    if(isHost) h+='<button id="sdelete" class="btn cant sm">Delete household</button>';
    h+='</div><p id="smsg" class="msg"></p></div>';
    h+='<div class="setblock"><button id="soutbtn" class="btn ghost block">Sign out</button></div>';
    return h;
  }

  function wire(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-act]'),function(b){
      b.onclick=function(){
        var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
        if(act==='acceptchip'){var grp=b.getAttribute('data-grp');var selc=document.querySelector('.daypick[data-grp="'+grp+'"] .daychip.sel');var v=selc?selc.getAttribute('data-day'):'';return acceptWithDay(id,(v===''||v==null)?null:parseInt(v,10));}
        if(act==='release')return releaseItem(id);
        if(act==='claim')return claimItem(id);
        return setStatus(id,act);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-cact]'),function(b){
      b.onclick=function(){
        var act=b.getAttribute('data-cact'),id=b.getAttribute('data-cid');
        var c=S.chores.filter(function(x){return x.id===id;})[0];if(!c)return;
        if(act==='eff')return updateChore(id,{effort:(c.effort%3)+1});
        if(act==='pwup')return updateChore(id,{per_week:Math.min(14,c.per_week+1)});
        if(act==='pwdown')return updateChore(id,{per_week:Math.max(1,c.per_week-1)});
        if(act==='del'){ if(typeof window.confirm!=='function'||window.confirm('Remove '+c.name+'? This also clears its entries for this week.')) return deleteChore(id); }
      };
    });
    var neff=document.getElementById('nceff');
    if(neff)neff.onclick=function(){var e=(+neff.getAttribute('data-eff'))%3+1;neff.setAttribute('data-eff',e);neff.innerHTML=dots(e)+' '+EFFORT[e];};
    var ncpwEl=document.getElementById('ncpw');
    function _getpw(){return parseInt(ncpwEl&&ncpwEl.textContent,10)||1;}
    var ncpwd=document.getElementById('ncpwd'),ncpwu=document.getElementById('ncpwu');
    if(ncpwd)ncpwd.onclick=function(){ncpwEl.textContent=Math.max(1,_getpw()-1)+'x';};
    if(ncpwu)ncpwu.onclick=function(){ncpwEl.textContent=Math.min(14,_getpw()+1)+'x';};
    var ncadd=document.getElementById('ncadd');
    if(ncadd)ncadd.onclick=function(){var nm=(document.getElementById('ncn').value||'').trim();if(!nm){document.getElementById('ncmsg').textContent='Enter a name.';return;}addChore(nm,+neff.getAttribute('data-eff'),_getpw());};
    var g=document.getElementById('gen');if(g)g.onclick=generateWeek;
    var r=document.getElementById('rf');if(r)r.onclick=refresh;
    var rl=document.getElementById('roll');if(rl)rl.onclick=rollover;
    var iv=document.getElementById('inv');if(iv)iv.onclick=inviteMember;
    var nh=document.getElementById('newhh');if(nh)nh.onclick=startNewHousehold;
    Array.prototype.forEach.call(document.querySelectorAll('.daychip[data-day]'),function(c){c.onclick=function(){var w=c.parentNode;Array.prototype.forEach.call(w.querySelectorAll('.daychip'),function(x){x.classList.remove('sel');});c.classList.add('sel');};});
    var _s;
    _s=document.getElementById('shhsave');if(_s)_s.onclick=renameHousehold;
    _s=document.getElementById('smysave');if(_s)_s.onclick=renameSelf;
    _s=document.getElementById('saway');if(_s)_s.onclick=toggleAway;
    _s=document.getElementById('sleave');if(_s)_s.onclick=leaveHousehold;
    _s=document.getElementById('sdelete');if(_s)_s.onclick=deleteHousehold;
    _s=document.getElementById('soutbtn');if(_s)_s.onclick=async function(){await sb.auth.signOut();location.href=homeUrl;};
    Array.prototype.forEach.call(document.querySelectorAll('[data-sact]'),function(b){b.onclick=function(){if(b.getAttribute('data-sact')==='makehost')return makeHost(b.getAttribute('data-sid'));};});
  }

  sb.auth.onAuthStateChange(function(){render();});
  render();
})();
</script>
</body>
</html>
